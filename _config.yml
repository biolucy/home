# Site
title: Lucy Evans
tagline: "PhD researcher in bacteriophage microbiology and antimicrobial resistance."
bio: "PhD researcher in bacteriophage microbiology and antimicrobial resistance."
description: "Lucy Evans - microbiology, bacteriophages, antimicrobial resistance and PhD life."
theme: monophase

reading_time: true
words_per_minute: 200

# Monophase
lang: en-GB
author:
  name: Lucy Evans
tags_path: /tags/

locale: en_GB
url: https://biolucy.co.uk


# Jekyll
permalink: /:title/

markdown: kramdown
highlighter: rouge

kramdown:
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  enable_coderay: false

mathjax: true

sass:
  sass_dir: _sass
  style: compressed


# Social
email: lre494@student.bham.ac.uk
github-url: biolucy
linkedin: lucyrevans

# Add Bluesky manually later if wanted, as Moonrise does not
# appear to have a built-in Bluesky setting in this config.


# Plugins
plugins:
  - jekyll-mentions
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-include-cache

jekyll-mentions:
  base_url: https://github.com


# Exclude from generated site
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - Gemfile.before-moonrise
  - _config.before-moonrise.yml
  - node_modules
  - gulpfile.js
  - package.json
  - _site
  - src
  - vendor
  - LICENSE
  - Rakefile