<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucy Evans - Portfolio</title>
    
    <link rel="icon" type="image/jpeg" href="image_86c6c9.jpg">
    
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

    <!-- Conference Announcement Banner -->
    <div class="conference-banner" style="
        background: linear-gradient(135deg, #4f46e5, #06b6d4);
        color: #ffffff;
        text-align: center;
        padding: 12px 20px;
        font-family: 'DM Sans', sans-serif;
        font-size: 0.95rem;
        font-weight: 500;
        letter-spacing: 0.5px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        position: relative;
        z-index: 10;
        width: 100%;
        box-sizing: border-box;
    ">
        Presenting at VOM 2026 in Prague! Check out my poster <strong>#123</strong> on Tuesday 7th July 😊
    </div>

    <canvas id="bgCanvas"></canvas>

    <main class="profile-container">
        
        <div class="avatar-wrapper">
            <img src="image01.jpg" alt="Lucy Evans Avatar" class="profile-avatar">
        </div>

        <p class="bio-text">
            Hi, I'm <strong class="highlight-dark">Lucy Evans</strong>. I am an MRC funded PhD student at the University of Birmingham, specialised in <strong class="highlight-dark">bacteriophage microbiology</strong> and <strong class="highlight-dark">antimicrobial resistance</strong> in <em class="italic-dark">Enterococcus</em>.
        </p>

        <div class="links-container">
            <a href="https://www.linkedin.com/in/lucyrevans/" class="btn btn-linkedin" target="_blank" rel="noopener noreferrer">
                LinkedIn <i class="fa-brands fa-linkedin-in"></i>
            </a>

            <a href="https://bsky.app/profile/biolucy.bsky.social" class="btn btn-bluesky" target="_blank" rel="noopener noreferrer">
                Bluesky <i class="fa-brands fa-bluesky"></i>
            </a>

            <a href="https://biolucy.github.io/PhDData" class="btn btn-github" target="_blank" rel="noopener noreferrer">
                GitHub <i class="fa-brands fa-github"></i>
            </a>

            <a href="mailto:lre494@student.bham.ac.uk" class="btn btn-email">
                Email <i class="fa-regular fa-envelope"></i>
            </a>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
