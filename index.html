<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucy Evans - Portfolio</title>
    
    <!-- Favicon Option using image_86c6c9.jpg -->
    <link rel="icon" type="image/jpeg" href="image01.jpg">
    
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for clean, modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">

<body>

    <!-- Background Canvas for Animated Dots/Shapes -->
    <canvas id="bgCanvas"></canvas>

    <!-- Main Content Container -->
    <main class="profile-container">
        
        <!-- Profile Avatar Section -->
        <div class="avatar-wrapper">
            <!-- Using your verbatim image filename here as well -->
            <img src="image01.jpg" alt="Lucy Evans Avatar" class="profile-avatar">
        </div>

        <!-- Bio Text Section -->
        <p class="bio-text">
            Hi, I'm <strong class="highlight-dark">Lucy Evans</strong>. I am an MRC funded PhD student at the University of Birmingham, specialised in <strong class="highlight-dark">bacteriophage microbiology</strong> and <strong class="highlight-dark">antimicrobial resistance</strong> in <em class="italic-dark">Enterococcus</em>.
        </p>

        <!-- Social Buttons Links -->
        <div class="links-container">
            <a href="https://www.linkedin.com/in/lucyrevans/" class="btn btn-linkedin" target="_blank" rel="noopener noreferrer">
                LinkedIn <i class="fa-brands fa-linkedin-in"></i>
            </a>
            <a href="https://bsky.app/profile/biolucy.bsky.social" class="btn btn-bluesky" target="_blank" rel="noopener noreferrer">
                Bluesky <i class="fa-solid fa-butterfly"></i>
            </a>
            <a href="https://biolucy.github.io/PhDData/" class="btn btn-github" target="_blank" rel="noopener noreferrer">
                PhD Data <i class="fa-brands fa-github"></i>
            </a>
            <a href="mailto:lre494@student.bham.ac.uk" class="btn btn-email">
                Email <i class="fa-regular fa-envelope"></i>
            </a>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
